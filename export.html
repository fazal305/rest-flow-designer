<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REST Flow Designer | Export Center</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" />
    <meta
      name="description"
      content="Export a saved API flow as raw graph JSON or generate a standalone runnable JavaScript file that replicates it with real fetch calls and branching logic."
    />
    <link rel="canonical" href="https://fazal305.github.io/rest-flow-designer/export.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/rest-flow-designer/export.html" />
    <meta property="og:title" content="REST Flow Designer | Export Center" />
    <meta
      property="og:description"
      content="Export a saved API flow as raw graph JSON or generate a standalone runnable JavaScript file that replicates it with real fetch calls and branching logic."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REST Flow Designer | Export Center" />
    <meta
      name="twitter:description"
      content="Export a saved API flow as raw graph JSON or generate a standalone runnable JavaScript file that replicates it with real fetch calls and branching logic."
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/export.css" />
  </head>
  <body>
    <div class="app-shell">
      <div data-sidebar></div>
      <main class="app-main">
        <section class="page-header">
          <div>
            <p class="page-kicker">Export Center</p>
            <h1 class="page-title">Generate portable flow assets</h1>
            <p class="page-description">
              Export raw graph JSON or generate a standalone JavaScript file
              that replicates the selected flow with real fetch calls and
              branching logic.
            </p>
          </div>
        </section>

        <section class="export-layout">
          <aside class="panel export-options">
            <div>
              <label class="form-label" for="exportSource">Flow source</label>
              <select class="form-select" id="exportSource"></select>
            </div>

            <div>
              <h2 class="panel-title mb-2">Export type</h2>
              <div class="export-type-grid" id="exportTypeGrid">
                <label class="export-type-card active" data-export-card="json">
                  <input type="radio" name="exportType" value="json" checked />
                  <span class="export-type-title">Flow JSON</span>
                  <span class="export-type-copy"
                    >Raw nodes, connections, metadata, and config.</span
                  >
                </label>
                <label class="export-type-card" data-export-card="javascript">
                  <input type="radio" name="exportType" value="javascript" />
                  <span class="export-type-title">Runnable JavaScript</span>
                  <span class="export-type-copy"
                    >A standalone script that executes this flow outside the
                    app.</span
                  >
                </label>
              </div>
            </div>

            <div class="export-summary" id="exportSummary"></div>
          </aside>

          <section class="panel">
            <div
              class="d-flex justify-content-between align-items-start gap-3 mb-3"
            >
              <div>
                <h2 class="panel-title">Generated Output</h2>
                <p class="panel-text mb-0">
                  Updates live when you change the source or export type.
                </p>
              </div>
            </div>
            <pre class="code-panel export-code-panel" id="exportCode"></pre>
            <div class="export-actions">
              <button class="btn btn-outline-primary" id="copyExportBtn">
                Copy
              </button>
              <button class="btn btn-primary" id="downloadExportBtn">
                Download
              </button>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/export.js"></script>
  </body>
</html>
