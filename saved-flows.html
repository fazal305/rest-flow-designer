<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REST Flow Designer | Saved Flows</title>
    <meta
      name="description"
      content="Search, filter, preview, open, run, duplicate, rename, delete, or export any saved API flow in your local REST Flow Designer workspace."
    />
    <link rel="canonical" href="https://fazal305.github.io/rest-flow-designer/saved-flows.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/rest-flow-designer/saved-flows.html" />
    <meta property="og:title" content="REST Flow Designer | Saved Flows" />
    <meta
      property="og:description"
      content="Search, filter, preview, open, run, duplicate, rename, delete, or export any saved API flow in your local REST Flow Designer workspace."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REST Flow Designer | Saved Flows" />
    <meta
      name="twitter:description"
      content="Search, filter, preview, open, run, duplicate, rename, delete, or export any saved API flow in your local REST Flow Designer workspace."
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/saved-flows.css" />
  </head>
  <body>
    <div class="app-shell">
      <div data-sidebar></div>
      <main class="app-main">
        <section class="page-header">
          <div>
            <p class="page-kicker">Saved Flows</p>
            <h1 class="page-title">Manage your workflow library</h1>
            <p class="page-description">
              Search, filter, preview, open, run, duplicate, rename, delete, or
              export any saved flow in your local workspace.
            </p>
          </div>
          <a class="btn btn-primary" href="flow-designer.html">Create Flow</a>
        </section>

        <section class="saved-toolbar">
          <div>
            <label class="form-label" for="searchInput">Search by name</label>
            <input
              class="form-control"
              id="searchInput"
              placeholder="Search saved flows"
            />
          </div>
          <div>
            <label class="form-label" for="tagFilter">Filter by tag</label>
            <select class="form-select" id="tagFilter"></select>
          </div>
          <button class="btn btn-outline-light" id="clearFiltersBtn">
            Clear
          </button>
        </section>

        <div class="filter-chip-row" id="tagChips"></div>
        <section class="saved-flow-grid" id="savedFlowGrid"></section>
      </main>
    </div>

    <div class="modal fade" id="renameModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="renameForm">
          <div class="modal-header">
            <h2 class="modal-title fs-5">Rename Flow</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="renameFlowId" />
            <label class="form-label" for="renameFlowName">New name</label>
            <input class="form-control" id="renameFlowName" required />
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-outline-light"
              type="button"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button class="btn btn-primary" type="submit">Rename</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/saved-flows.js"></script>
  </body>
</html>
